name: 'Swapvera: model migration verdict'
description: 'Runs your prompts on the current and the replacement LLM and comments a statistical verdict on the pull request.'
author: 'Swapvera'
branding:
  icon: 'check-circle'
  color: 'blue'
inputs:
  config:
    description: 'Path to swapvera.yaml.'
    default: 'swapvera.yaml'
  from:
    description: 'Override the current model (provider:model).'
    default: ''
  to:
    description: 'Override the replacement model (provider:model or auto).'
    default: ''
  license:
    description: 'Swapvera license key for the hosted judge. Leave empty to judge with your own key (judge.mode: byok).'
    default: ''
  fail-on:
    description: 'do_not_migrate (default), review or never.'
    default: 'do_not_migrate'
  comment:
    description: 'Post or update a comment on the pull request.'
    default: 'true'
  github-token:
    description: 'Token used to comment.'
    default: ${{ github.token }}
  share:
    description: 'Share anonymous outcome categories with the migration atlas (never prompts or outputs). Needs a license.'
    default: 'false'
  engine-spec:
    description: 'pip install spec for the engine.'
    default: 'swapvera'
outputs:
  verdict:
    description: 'safe, review, do_not_migrate or inconclusive.'
    value: ${{ steps.run.outputs.verdict }}
  report:
    description: 'Path to the Markdown report.'
    value: ${{ steps.run.outputs.report }}
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Swapvera
      shell: bash
      env:
        SPEC: ${{ inputs.engine-spec }}
      run: python -m pip install --quiet "$SPEC"
    - name: Run verdict
      id: run
      shell: bash
      env:
        SWAPVERA_LICENSE: ${{ inputs.license }}
        CONFIG: ${{ inputs.config }}
        FROM: ${{ inputs.from }}
        TO: ${{ inputs.to }}
        SHARE: ${{ inputs.share }}
      run: |
        set +e
        args=(run -c "$CONFIG" --out swapvera-report.md --json swapvera-report.json --fail-on never)
        [ -n "$FROM" ] && args+=(--from "$FROM")
        [ -n "$TO" ] && args+=(--to "$TO")
        [ "$SHARE" = "true" ] && args+=(--share)
        swapvera "${args[@]}"
        code=$?
        set -e
        if [ ! -f swapvera-report.json ]; then
          echo "::error::Swapvera could not run (exit $code). See the log above."
          exit 2
        fi
        verdict=$(python -c "import json;print(json.load(open('swapvera-report.json'))['verdict'])")
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "report=swapvera-report.md" >> "$GITHUB_OUTPUT"
        cat swapvera-report.md >> "$GITHUB_STEP_SUMMARY"
    - name: Comment on pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | contains("<!-- swapvera-verdict -->")) | .id' | head -n1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@swapvera-report.md > /dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@swapvera-report.md > /dev/null
        fi || echo "::warning::Could not comment (needs pull-requests: write)."
    - name: Apply fail-on
      shell: bash
      env:
        VERDICT: ${{ steps.run.outputs.verdict }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        case "$FAIL_ON:$VERDICT" in
          never:*) exit 0 ;;
          *:do_not_migrate|*:inconclusive) echo "::error::Swapvera verdict: $VERDICT"; exit 1 ;;
          review:review) echo "::error::Swapvera verdict: review"; exit 1 ;;
          *) exit 0 ;;
        esac
