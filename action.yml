name: 'Swapvera: model migration verdict'
description: 'Tests a model switch on your real production requests and comments a statistical verdict on the pull request.'
author: 'Swapvera'
branding:
  icon: 'check-circle'
  color: 'blue'
# Cliente fino de la API alojada: la comparacion corre en Swapvera con las trazas de produccion del proyecto.
# No instala nada; solo usa curl y el python3 que ya trae el runner.
inputs:
  license:
    description: 'Swapvera project key (sv_...). Store it as a secret.'
    required: true
  feature:
    description: 'The feature to test, as it appears in the dashboard (its SDK feature name or label). Optional when the project has one feature.'
    default: ''
  to:
    description: 'Replacement model (provider:model), or auto for the first suggestion: the official replacement when the current model is shutting down.'
    default: 'auto'
  cases:
    description: 'Distinct production requests to compare (10 to 300).'
    default: '150'
  reuse-days:
    description: 'Reuse a finished comparison of the same feature and model from the last N days instead of spending a new one. 0 always runs a new one.'
    default: '7'
  timeout-minutes:
    description: 'How long to wait for the comparison.'
    default: '60'
  fail-on:
    description: 'do_not_migrate (default), review or never.'
    default: 'do_not_migrate'
  comment:
    description: 'Post or update a comment on the pull request.'
    default: 'true'
  github-token:
    description: 'Token used to comment.'
    default: ${{ github.token }}
  api-url:
    description: 'Swapvera API.'
    default: 'https://swapvera.com'
outputs:
  verdict:
    description: 'safe, review, do_not_migrate or inconclusive.'
    value: ${{ steps.run.outputs.verdict }}
  report:
    description: 'Path to the Markdown report.'
    value: ${{ steps.run.outputs.report }}
  experiment:
    description: 'Id of the comparison in the dashboard.'
    value: ${{ steps.run.outputs.experiment }}
runs:
  using: 'composite'
  steps:
    - name: Run verdict
      id: run
      shell: bash
      env:
        SV_KEY: ${{ inputs.license }}
        SV_API: ${{ inputs.api-url }}
        FEATURE: ${{ inputs.feature }}
        TO: ${{ inputs.to }}
        CASES: ${{ inputs.cases }}
        REUSE_DAYS: ${{ inputs.reuse-days }}
        TIMEOUT_MIN: ${{ inputs.timeout-minutes }}
      run: python3 "$GITHUB_ACTION_PATH/verdict.py"
    - name: Comment on pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | contains("<!-- swapvera-verdict -->")) | .id' | head -n1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@swapvera-report.md > /dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@swapvera-report.md > /dev/null
        fi || echo "::warning::Could not comment (needs pull-requests: write)."
    - name: Apply fail-on
      shell: bash
      env:
        VERDICT: ${{ steps.run.outputs.verdict }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        case "$FAIL_ON:$VERDICT" in
          never:*) exit 0 ;;
          *:do_not_migrate|*:inconclusive) echo "::error::Swapvera verdict: $VERDICT"; exit 1 ;;
          review:review) echo "::error::Swapvera verdict: review"; exit 1 ;;
          *) exit 0 ;;
        esac
